[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bm-converter"
version = "0.1.0"
description = "Convert Model_*.txt planetary interior models to AxiSEM .bm format"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
bm-convert = "bm_converter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
